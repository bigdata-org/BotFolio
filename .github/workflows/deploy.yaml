name: Build and Deploy to GCP Cloud Run

on:
  push:
    branches: [ main ]  # Change this to match your main branch name
  pull_request:
    branches: [ main ]

env:
  # Global environment variables available to all jobs and steps
  PROJECT_ID: botfolio-456006
  SERVICE_NAME: botfolio-fastapi
  REGION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
 
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
 
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
     
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker
 
      # OPTIONAL – Enable required services (Run once or in infra pipeline)
      - name: Enable Required APIs
        run: |
          gcloud services enable run.googleapis.com
          gcloud services enable containerregistry.googleapis.com

      # Build Docker image
      - name: Build Docker image
        run: docker build --platform=linux/amd64 -t gcr.io/${{ env.PROJECT_ID }}/botfolio-fastapi .
      
      # Push Docker image to Google Container Registry
      - name: Push Docker image
        run: docker push gcr.io/${{ env.PROJECT_ID }}/botfolio-fastapi
      
      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/botfolio-fastapi \
            --platform managed \
            --region ${{ env.REGION }} \
            --memory 2Gi \
            --allow-unauthenticated